<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Entry journey</title>
<style>
  body { margin: 0; padding: 48px 64px; font: 16px/1.5 -apple-system, Helvetica, Arial, sans-serif; color: #1d3b38; background: #fbfaf7; }
  h1 { font-size: 44px; margin: 0 0 8px; color: #0e5a50; }
  h2 { font-size: 32px; margin: 56px 0 16px; padding-bottom: 12px; border-bottom: 3px solid #0e5a50; }
  h3 { font-size: 18px; margin: 32px 0 12px; display: flex; align-items: center; gap: 10px; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 4px; background: #0e5a50; color: #fff; }
  .mock { width: 1200px; border: 1px solid #d6d9d4; background: #fff; border-radius: 8px; overflow: hidden; }
  .mock header { background: #0e5a50; color: #fff; padding: 18px 24px; font-weight: 600; }
  .mock .body { padding: 32px 24px; display: grid; gap: 16px; }
  .mock .row { height: 44px; background: #eef1ee; border-radius: 6px; }
  .mock button { justify-self: start; padding: 12px 22px; border: 0; border-radius: 6px; background: #e5603b; color: #fff; font-weight: 600; }
</style>
</head>
<body>
  <h1>Entry journey</h1>
  <p>Every screen of the application, in order.</p>

  <h2>Member Zone</h2>
  <div class="screen-block">
    <h3>01 · Member Zone – not started (guardian) <span class="badge">Main path</span></h3>
    <div class="mock"><header>Member Zone</header><div class="body"><div class="row"></div><div class="row"></div><button>Start application</button></div></div>
  </div>
  <div class="screen-block">
    <h3>02 · Member Zone – in progress</h3>
    <div class="mock"><header>Member Zone</header><div class="body"><div class="row"></div><button>Continue</button></div></div>
  </div>

  <h2>Payment</h2>
  <div class="flat">
    <h3>03 · Payment</h3>
    <div class="mock"><header>Pay the entry fee</header><div class="body"><div class="row"></div><div class="row"></div><div class="row"></div><button>Pay £42</button></div></div>
    <h3>04 · Payment confirmed <span class="badge">Main path</span></h3>
    <div class="mock"><header>Thank you</header><div class="body"><div class="row"></div><button>Back to Member Zone</button></div></div>
  </div>
</body>
</html>
