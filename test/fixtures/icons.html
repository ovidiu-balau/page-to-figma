<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Icons</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<style>
  body { margin: 0; padding: 40px; font-family: system-ui, sans-serif; }
  .row { display: flex; gap: 24px; align-items: center; font-size: 28px; color: #4f46e5; margin-bottom: 24px; }
  .label { font-size: 14px; color: #52525b; width: 140px; }
  button { display: inline-flex; gap: 8px; align-items: center; padding: 10px 16px; border-radius: 8px; border: 0; background: #18181b; color: #fff; font-size: 14px; }
</style>
</head>
<body>
  <div class="row"><span class="label">Font Awesome</span><i class="fa-solid fa-house"></i><i class="fa-regular fa-heart"></i><i class="fa-brands fa-github"></i></div>
  <div class="row"><span class="label">Bootstrap Icons</span><i class="bi bi-alarm"></i><i class="bi bi-bag-check"></i><i class="bi bi-gear-fill"></i></div>
  <div class="row"><span class="label">Material Symbols</span><span class="material-symbols-outlined">home</span><span class="material-symbols-outlined">search</span><span class="material-symbols-outlined">settings</span></div>
  <button><i class="fa-solid fa-paper-plane"></i> Send message</button>
</body>
</html>
